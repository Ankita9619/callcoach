# Install once:  pip install pre-commit && pre-commit install
# The backend hooks use the tools from the backend's virtualenv, so activate it first
# (source backend/.venv/bin/activate). Run on everything: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (backend)
        entry: bash -c 'cd backend && ruff format .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-check
        name: ruff check (backend)
        entry: bash -c 'cd backend && ruff check --fix .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend && mypy app tests'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
